name: WorkBuddy Daily Checkin

on:
  schedule:
    # 北京时间 00:36 = UTC 16:36。每天只跑这一次。
    # 不要改这条 cron，也不要改成整点（整点拥堵，容易被推迟或丢掉）。
    - cron: "36 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Claim daily credits
        env:
          WORKBUDDY_ACCESS_TOKEN: ${{ secrets.WORKBUDDY_ACCESS_TOKEN }}
          WORKBUDDY_REFRESH_TOKEN: ${{ secrets.WORKBUDDY_REFRESH_TOKEN }}
          WORKBUDDY_UID: ${{ secrets.WORKBUDDY_UID }}
          WORKBUDDY_DOMAIN: ${{ secrets.WORKBUDDY_DOMAIN }}
          WORKBUDDY_ENTERPRISE_ID: ${{ secrets.WORKBUDDY_ENTERPRISE_ID }}
          # 别人也能看到仓库时保持为空。只有自己能看的仓库，想在日志里看账户总额时，把 Actions Variable 设为 1。
          WORKBUDDY_SHOW_BALANCE: ${{ vars.WORKBUDDY_SHOW_BALANCE }}
          # 通知（可选，配一个即可）：默认只推「新领取成功 / 未开启 / 报错」
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WXPUSHER_APPTOKEN: ${{ secrets.WXPUSHER_APPTOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          QMSG_KEY: ${{ secrets.QMSG_KEY }}
          QMSG_QQ: ${{ secrets.QMSG_QQ }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          # 「今日已签」也想收到消息就设变量 NOTIFY_ALWAYS=1
          NOTIFY_ALWAYS: ${{ vars.NOTIFY_ALWAYS }}
        run: python scripts/checkin.py

      # 兜底：前面任何一步失败（含依赖安装、Python 崩溃）都补一条微信，
      # 不依赖签到脚本自己跑成功。
      - name: 失败兜底通知
        if: failure()
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WXPUSHER_APPTOKEN: ${{ secrets.WXPUSHER_APPTOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          QMSG_KEY: ${{ secrets.QMSG_KEY }}
          QMSG_QQ: ${{ secrets.QMSG_QQ }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          FAILED_STEP: ${{ job.status }}
        run: |
          python scripts/notify.py --fallback || echo "兜底通知未发出（不影响运行结论）"
